name: Run power outages monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [check-dtek, check-emergency, check-addresses]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INGEST_URL: ${{ secrets.INGEST_URL }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout artifacts
        run: |
          REMOTE_BRANCH=$(git ls-remote --heads origin artifacts)

          if [ -n "$REMOTE_BRANCH" ]; then
            git fetch --depth 1 origin artifacts
            git worktree add --detach artifacts FETCH_HEAD
          else
            git worktree add --orphan -b artifacts artifacts
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Determine check type
        id: check-type
        run: |
          if [ "${{ github.event.action }}" = "check-emergency" ]; then
            echo "address=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "address=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(date -u +%H)
          minute=$(date -u +%M)
          if [ "$minute" = "00" ] && ((10#$hour % 12 == 0)); then
            echo "address=true" >> "$GITHUB_OUTPUT"
          else
            echo "address=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run monitoring script
        if: github.event.action != 'check-addresses'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REGION: ${{ secrets.REGION }}
          CITY: ${{ secrets.CITY }}
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
          CHECK_ADDRESS: ${{ steps.check-type.outputs.address }}
          CHECK_GRID_STATUS: ${{ secrets.CHECK_GRID_STATUS }}
        run: node ./src/monitor.js

      - name: Check all regions for the shared bot
        if: always() && env.INGEST_URL != '' && github.event.action != 'check-addresses'
        continue-on-error: true
        timeout-minutes: 5
        run: node ./src/ingest-regions.js

      # Cheap when nothing is queued (one HTTP request); any run also drains requests whose dispatch failed.
      - name: Check pending addresses for the shared bot
        if: always() && env.INGEST_URL != ''
        continue-on-error: true
        timeout-minutes: 5
        run: node ./src/check-addresses.js

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git -C artifacts add --all

          if git -C artifacts diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          if git -C artifacts rev-parse --verify --quiet HEAD; then
            git -C artifacts commit --amend --no-edit
          else
            git -C artifacts commit -m "chore: update artifacts"
          fi

          git push --force origin "$(git -C artifacts rev-parse HEAD):refs/heads/artifacts"

      - name: Keep workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/enable"
