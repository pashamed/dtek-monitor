name: Run power outages monitor

# Personal channel monitor (src/monitor.js). The shared bot dispatches check-emergency every 15 minutes
# (Dtek:Timers:MonitorWorkflowIntervalMinutes); this cron is only a backup because GitHub often skips scheduled runs.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      message_id:
        description: "Optional Telegram post message ID to check and reply to"
        required: false
        type: string
  repository_dispatch:
    types: [check-dtek, check-emergency, check-channel-outage]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.message_id || inputs.message_id || 'monitor' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    if: github.event.action != 'check-channel-outage' || !vars.STANDALONE_MONITOR_CHAT_ID || format('{0}', github.event.client_payload.chat_id) == vars.STANDALONE_MONITOR_CHAT_ID
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout artifacts
        if: ${{ github.event.action != 'check-channel-outage' && !(github.event_name == 'workflow_dispatch' && inputs.message_id != '') }}
        run: |
          REMOTE_BRANCH=$(git ls-remote --heads origin artifacts)

          if [ -n "$REMOTE_BRANCH" ]; then
            git fetch --depth 1 origin artifacts
            git worktree add --detach artifacts FETCH_HEAD
          else
            git worktree add --orphan -b artifacts artifacts
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      # The hourly backup checks only the regional popup; all dispatches also check the configured address.
      - name: Determine check type
        id: check-type
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "address=false" >> "$GITHUB_OUTPUT"
          else
            echo "address=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run monitoring script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REGION: ${{ secrets.REGION }}
          CITY: ${{ secrets.CITY }}
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
          CHECK_ADDRESS: ${{ steps.check-type.outputs.address }}
          CHECK_GRID_STATUS: ${{ secrets.CHECK_GRID_STATUS }}
          CHANNEL_TRIGGER: ${{ github.event.action == 'check-channel-outage' || (github.event_name == 'workflow_dispatch' && inputs.message_id != '') }}
          CHANNEL_TRIGGER_CHAT_ID: ${{ (github.event.action == 'check-channel-outage' && github.event.client_payload.chat_id) || vars.STANDALONE_MONITOR_CHAT_ID || secrets.STANDALONE_MONITOR_CHAT_ID }}
          CHANNEL_TRIGGER_MESSAGE_ID: ${{ github.event.action == 'check-channel-outage' && github.event.client_payload.message_id || inputs.message_id }}
          STANDALONE_MONITOR_CHAT_ID: ${{ vars.STANDALONE_MONITOR_CHAT_ID || secrets.STANDALONE_MONITOR_CHAT_ID }}
        run: node ./src/monitor.js

      - name: Commit updated artifacts
        if: ${{ github.event.action != 'check-channel-outage' && !(github.event_name == 'workflow_dispatch' && inputs.message_id != '') }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git -C artifacts add --all

          if git -C artifacts diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          if git -C artifacts rev-parse --verify --quiet HEAD; then
            git -C artifacts commit --amend --no-edit
          else
            git -C artifacts commit -m "chore: update artifacts"
          fi

          git push --force origin "$(git -C artifacts rev-parse HEAD):refs/heads/artifacts"

      - name: Keep workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/enable"
