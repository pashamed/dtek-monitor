<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">DTEK Monitor application architecture</title>
  <desc id="desc">External data and GitHub browser workers feed a shared .NET backend with SQL Server. Telegram hosts the Mini App and receives subscription-specific notifications. GitHub and backend timers both trigger updates. Svitlobot integration and the standalone Node monitor are optional.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172554}
      .title{font-size:29px;font-weight:700}.subtitle{font-size:16px;fill:#475569}
      .heading{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .backend{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa;stroke-width:1.5}
      .green{fill:#ecfdf5;stroke:#6ee7b7;stroke-width:1.5}.purple{fill:#faf5ff;stroke:#c084fc;stroke-width:1.5}
      .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:7 5}
      .label{font-size:13px;fill:#475569;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="1120" fill="#fff"/>
  <text x="40" y="47" class="title">DTEK Monitor | Architecture overview</text>
  <text x="40" y="76" class="subtitle">Shared bot + Mini App + GitHub workers | Working-tree architecture, 21 October 2026</text>

  <rect x="30" y="105" width="1380" height="150" rx="16" class="lane"/>
  <text x="50" y="135" class="heading">EXTERNAL DATA</text>
  <rect x="50" y="151" width="310" height="82" rx="10" class="node"/>
  <text x="67" y="178" class="heading">DTEK sites</text>
  <text x="67" y="202" class="body">Regional popups, addresses, directories</text>
  <rect x="380" y="151" width="280" height="82" rx="10" class="node"/>
  <text x="397" y="178" class="heading">Yasno API</text>
  <text x="397" y="202" class="body">Kyiv address / group data</text>
  <rect x="680" y="151" width="345" height="82" rx="10" class="node"/>
  <text x="697" y="178" class="heading">outage-data-ua on GitHub</text>
  <text x="697" y="202" class="body">Schedule JSON + prepared image URLs</text>
  <rect x="1045" y="151" width="345" height="82" rx="10" class="node"/>
  <text x="1062" y="178" class="heading">ua-power-status on GitHub</text>
  <text x="1062" y="202" class="body">Ukrenergo regional-status JSON</text>

  <rect x="30" y="285" width="380" height="590" rx="16" class="lane"/>
  <text x="50" y="318" class="heading">GITHUB REPOSITORY + ACTIONS</text>
  <rect x="50" y="338" width="340" height="80" rx="10" class="node"/>
  <text x="67" y="366" class="heading">main branch</text>
  <text x="67" y="391" class="body">Code + regional configuration</text>
  <rect x="50" y="440" width="340" height="111" rx="10" class="green"/>
  <text x="67" y="468" class="heading">Monitor worker</text>
  <text x="67" y="493" class="body">Node.js + Playwright Chromium</text>
  <text x="67" y="517" class="body">15-min cron / manual / dispatch</text>
  <text x="67" y="539" class="small">Popups, groups, directories, queued checks</text>
  <rect x="50" y="573" width="340" height="70" rx="10" class="green"/>
  <text x="67" y="601" class="heading">Schedule-refresh worker</text>
  <text x="67" y="625" class="body">5-min cron calls backend tick</text>
  <rect x="50" y="665" width="340" height="70" rx="10" class="purple"/>
  <text x="67" y="693" class="heading">Optional LLM</text>
  <text x="67" y="717" class="body">Unfamiliar public popup text only</text>
  <rect x="50" y="757" width="340" height="91" rx="10" class="node"/>
  <text x="67" y="785" class="heading">artifacts branch</text>
  <text x="67" y="810" class="body">Standalone state + model cache</text>
  <text x="67" y="833" class="small">Release workflow: releases, NOT deployment</text>

  <rect x="470" y="285" width="500" height="590" rx="16" class="backend"/>
  <text x="490" y="318" class="heading">SHARED BACKEND | ASP.NET CORE / .NET 10</text>
  <rect x="490" y="338" width="460" height="75" rx="10" class="node"/>
  <text x="507" y="365" class="heading">HTTP boundaries</text>
  <text x="507" y="389" class="body">/api/* | /webhook | /ingest* | /lite/ | /health</text>
  <rect x="490" y="440" width="460" height="100" rx="10" class="blue"/>
  <text x="507" y="468" class="heading">Collection + scheduling</text>
  <text x="507" y="493" class="body">5-min TickLoop; parallel source collection</text>
  <text x="507" y="518" class="body">HTTP + caches; GitHub browser fallback</text>
  <rect x="490" y="565" width="460" height="100" rx="10" class="blue"/>
  <text x="507" y="593" class="heading">Business rules + notifications</text>
  <text x="507" y="618" class="body">Region / district / address / group routing</text>
  <text x="507" y="643" class="body">Source reconciliation, templates, deduplication</text>
  <rect x="490" y="690" width="460" height="80" rx="10" class="node"/>
  <text x="507" y="718" class="heading">Supporting services</text>
  <text x="507" y="743" class="body">Address queue, diagnostics, timetable sync</text>
  <rect x="490" y="795" width="460" height="55" rx="10" class="node"/>
  <text x="507" y="829" class="body">Memory caches / gates: local to one process</text>

  <rect x="1030" y="285" width="380" height="410" rx="16" class="lane"/>
  <text x="1050" y="318" class="heading">TELEGRAM + USERS</text>
  <rect x="1050" y="338" width="340" height="95" rx="10" class="green"/>
  <text x="1067" y="366" class="heading">Mini App in Telegram WebView</text>
  <text x="1067" y="391" class="body">HTML / vanilla JS / CSS from backend</text>
  <text x="1067" y="416" class="body">Settings, diagnostics, read-only plans</text>
  <rect x="1050" y="470" width="340" height="80" rx="10" class="node"/>
  <text x="1067" y="498" class="heading">Telegram Bot API</text>
  <text x="1067" y="523" class="body">Incoming updates; outgoing messages</text>
  <rect x="1050" y="587" width="340" height="80" rx="10" class="green"/>
  <text x="1067" y="615" class="heading">Subscribed destinations</text>
  <text x="1067" y="640" class="body">Private chat / channels / groups</text>
  <rect x="1030" y="730" width="380" height="145" rx="16" class="purple"/>
  <text x="1050" y="764" class="heading">OPTIONAL SVITLOBOT API</text>
  <text x="1050" y="792" class="body">Encrypted saved channel key</text>
  <text x="1050" y="818" class="body">Combined weekly timetable sync</text>
  <text x="1050" y="844" class="body">Write limits + weekly refresh</text>

  <rect x="470" y="930" width="500" height="120" rx="16" class="node"/>
  <text x="490" y="962" class="heading">SQL SERVER | EF CORE</text>
  <text x="490" y="989" class="body">Subscriptions, admins, addresses, source states</text>
  <text x="490" y="1015" class="body">Deliveries, pending checks, schedule-diff baselines</text>
  <text x="490" y="1039" class="small">SQLite is used by isolated tests, not production</text>

  <path d="M205 233 V440" class="edge"/>
  <path d="M855 233 V270 H720 V440" class="edge"/>
  <path d="M1218 233 V270 H920 V440" class="edge"/>
  <path d="M520 233 V260 H450 V455 H490" class="edge"/>
  <path d="M390 495 H490" class="edge"/>
  <text x="397" y="482" class="label">ingest</text>
  <path d="M390 608 H490" class="edge"/>
  <text x="400" y="595" class="label">tick</text>
  <path d="M490 530 H435 V560 H220 V551" class="edge"/>
  <text x="282" y="557" class="label">dispatch fallback</text>
  <path d="M220 551 V665" class="edge optional"/>
  <path d="M720 413 V440" class="edge"/>
  <path d="M720 540 V565" class="edge"/>
  <path d="M720 665 V690" class="edge"/>
  <path d="M720 875 V930" class="edge"/>
  <text x="734" y="906" class="label">durable state</text>
  <path d="M1050 375 H950" class="edge"/>
  <text x="970" y="362" class="label">initData / API</text>
  <path d="M1050 510 H995 V405 H950" class="edge"/>
  <text x="985" y="450" class="label">webhook</text>
  <path d="M950 610 H1008 V532 H1050" class="edge"/>
  <text x="958" y="597" class="label">send / edit / reply</text>
  <path d="M1220 550 V587" class="edge"/>
  <path d="M950 730 H1000 V805 H1030" class="edge optional"/>
  <text x="974" y="777" class="label">sync</text>
  <text x="40" y="1090" class="small">Optional standalone mode: Node monitor posts directly to one chat, bypassing shared backend subscriptions.</text>
</svg>
